<!-- Gallery sample: copy the section into any page where you want a gallery -->
<section class="section-py image-gallery" aria-label="Gallery">
  <div class="container-xl">
    <div class="section-head text-center mb-4">
      <h2>Gallery</h2>
      <p class="muted">Add your images to assets/images/ and update filenames below.</p>
    </div>

    <div class="image-grid">
      <figure class="image-card">
        <a href="assets/images/gallery-01.jpg" target="_blank" rel="noopener">
          <img src="assets/images/gallery-01.jpg" alt="Gallery image 1">
        </a>
        <figcaption>Caption for image 1</figcaption>
      </figure>
      <figure class="image-card">
        <a href="assets/images/gallery-02.jpg" target="_blank" rel="noopener">
          <img src="assets/images/gallery-02.jpg" alt="Gallery image 2">
        </a>
        <figcaption>Caption for image 2</figcaption>
      </figure>
      <figure class="image-card">
        <a href="assets/images/gallery-03.jpg" target="_blank" rel="noopener">
          <img src="assets/images/gallery-03.jpg" alt="Gallery image 3">
        </a>
        <figcaption>Caption for image 3</figcaption>
      </figure>
      <figure class="image-card">
        <a href="assets/images/gallery-04.jpg" target="_blank" rel="noopener">
          <img src="assets/images/gallery-04.jpg" alt="Gallery image 4">
        </a>
        <figcaption>Caption for image 4</figcaption>
      </figure>
    </div>
  </div>
</section>
